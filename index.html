<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Log</title>
<style>
  :root {
    --ink: #1C1B19;
    --chalk: #F7F5F0;
    --iron: #8B8378;
    --flag: #D6541C;
    --moss: #3D5A4C;
    --card: #E8E3D8;
    --hairline: #D8D2C4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--chalk);
    color: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--ink);
  }

  .title-block h1 {
    font-family: 'Arial Narrow', Arial, sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: -0.5px;
    text-transform: uppercase;
  }

  .title-block p {
    color: var(--iron);
    font-size: 13px;
    margin-top: 2px;
    letter-spacing: 0.3px;
  }

  .stamp {
    font-family: 'Arial Narrow', Arial, sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: 2.5px solid var(--moss);
    color: var(--moss);
    padding: 6px 14px;
    transform: rotate(-4deg);
    border-radius: 3px;
    white-space: nowrap;
  }
  .stamp.pending {
    border-color: var(--iron);
    color: var(--iron);
  }

  section {
    margin-bottom: 36px;
  }

  .eyebrow {
    font-family: 'Arial Narrow', Arial, sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--iron);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  .ledger-line {
    background: var(--card);
    border-radius: 4px;
    padding: 18px 20px;
  }

  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 14px;
  }
  .field-row:last-child { border-bottom: none; }

  .field-label {
    color: var(--iron);
  }

  .field-value {
    font-weight: 600;
    text-align: right;
  }

  .field-value.good { color: var(--moss); }
  .field-value.flag { color: var(--flag); }

  .transcript-quote {
    font-size: 13px;
    color: var(--iron);
    font-style: italic;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--hairline);
    line-height: 1.6;
  }

  .week-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .week-stat {
    background: var(--card);
    border-radius: 4px;
    padding: 14px 16px;
    flex: 1;
    min-width: 130px;
  }

  .week-stat .num {
    font-family: 'Arial Narrow', Arial, sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.5px;
  }

  .week-stat .label {
    font-size: 11px;
    color: var(--iron);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .directive {
    background: var(--ink);
    color: var(--chalk);
    border-radius: 4px;
    padding: 20px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .directive .rec {
    font-family: 'Arial Narrow', Arial, sans-serif;
    font-weight: 800;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .directive .why {
    font-size: 13px;
    color: #B8B3A6;
    text-align: right;
  }

  .findings-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .finding {
    background: var(--card);
    border-left: 3px solid var(--moss);
    border-radius: 0 4px 4px 0;
    padding: 12px 16px;
  }
  .finding.flag-type { border-left-color: var(--flag); }

  .finding .f-title {
    font-weight: 700;
    font-size: 13.5px;
  }
  .finding .f-detail {
    font-size: 13px;
    color: var(--iron);
    margin-top: 3px;
    line-height: 1.5;
  }

  .finding .f-date {
    font-size: 11px;
    color: var(--iron);
    margin-top: 8px;
    opacity: 0.75;
  }

  .empty-state {
    background: var(--card);
    border-radius: 4px;
    padding: 24px 20px;
    text-align: center;
    color: var(--iron);
    font-size: 13.5px;
  }

  .loading {
    color: var(--iron);
    font-size: 13px;
    padding: 12px 0;
  }

  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--hairline);
    font-size: 11.5px;
    color: var(--iron);
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 480px) {
    .title-block h1 { font-size: 24px; }
    header { flex-direction: column; gap: 16px; }
  }

  .qa-bubble {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .qa-bubble.user {
    background: var(--ink);
    color: var(--chalk);
    border-radius: 16px 16px 4px 16px;
    align-self: flex-end;
    margin-left: auto;
  }
  .qa-bubble.assistant {
    background: white;
    color: var(--ink);
    border: 1.5px solid var(--hairline);
    border-radius: 16px 16px 16px 4px;
    align-self: flex-start;
  }
  .qa-bubble.error {
    background: #FEF0EB;
    border: 1.5px solid var(--flag);
    color: var(--flag);
    border-radius: 8px;
    font-size: 13px;
  }
  .qa-typing {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 12px 16px;
    background: white;
    border: 1.5px solid var(--hairline);
    border-radius: 16px 16px 16px 4px;
    width: fit-content;
  }
  .qa-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--moss);
    animation: qa-pulse 1.2s ease-in-out infinite;
  }
  .qa-dot:nth-child(2) { animation-delay: 0.2s; }
  .qa-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes qa-pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
  }
  .qa-chip {
    background: white;
    border: 1.5px solid var(--hairline);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12.5px;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .qa-chip:hover { border-color: var(--iron); }
  #qa-input:focus { border-color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Training Log</h1>
      <p id="today-date">—</p>
    </div>
    <div class="stamp pending" id="status-stamp">LOADING</div>
  </header>

  <section>
    <div class="eyebrow">This Morning</div>
    <div id="morningcheck-section">
      <div class="loading">Checking this morning's recommendation…</div>
    </div>
  </section>

  <section>
    <div class="eyebrow">Today</div>
    <div class="ledger-line" id="today-section">
      <div class="loading">Reading today's entry…</div>
    </div>
  </section>

  <section>
    <div class="eyebrow">Tomorrow</div>
    <div id="weather-section">
      <div class="loading">Checking forecast…</div>
    </div>
  </section>

  <section>
    <div class="eyebrow">This Week</div>
    <div id="week-section">
      <div class="loading">Reading weekly trends…</div>
    </div>
  </section>

  <section>
    <div class="eyebrow">Weekly Summary</div>
    <div id="weeklysummary-section">
      <div class="loading">Checking for a weekly summary…</div>
    </div>
  </section>

  <section>
    <div class="eyebrow">Agent Findings</div>
    <div id="findings-section">
      <div class="loading">Checking for findings…</div>
    </div>
  </section>

  <section>
    <div class="eyebrow">Ask</div>
    <div id="qa-section">
      <div id="qa-suggestions" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;"></div>
      <div id="qa-messages" style="display:flex;flex-direction:column;gap:12px;margin-bottom:14px;"></div>
      <div style="display:flex;gap:10px;align-items:flex-end;">
        <textarea id="qa-input" placeholder="Ask about your training history…" rows="1"
          style="flex:1;background:white;border:1.5px solid var(--hairline);border-radius:20px;padding:9px 16px;font-size:14px;font-family:inherit;resize:none;outline:none;color:var(--ink);line-height:1.5;transition:border-color 0.15s;"></textarea>
        <button id="qa-btn"
          style="background:var(--hairline);color:var(--iron);border:none;border-radius:20px;padding:9px 20px;font-size:12px;font-weight:700;letter-spacing:0.8px;font-family:inherit;cursor:default;transition:background 0.15s,color 0.15s;white-space:nowrap;">ASK</button>
      </div>
    </div>
  </section>

  <footer>
    <span>Personal training log · single user</span>
    <span id="last-updated">—</span>
  </footer>
</div>

<script>
const SHEET_ID = '1ne8KrrVYxRq1TJYBFE9LmRrwTp2itOMWiO4hp4bdLLQ';
const GIDS = {
  daily_log: 0,
  weekly_log: 537109287,
  weather_log: 1201988282,
  agent_findings: 1931859222,
  weekly_summaries: 1745857925,
  morning_checks: 1057893899
};

async function fetchTab(gid) {
  if (gid === null || gid === undefined) return null;
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${gid}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const jsonStr = text.substring(47).slice(0, -2);
    const parsed = JSON.parse(jsonStr);
    const headersAlreadyParsed = parsed.table.parsedNumHeaders > 0;
    const headers = parsed.table.cols.map((c, i) => {
      if (headersAlreadyParsed) return c.label;
      const firstRow = parsed.table.rows[0];
      return firstRow && firstRow.c[i] ? firstRow.c[i].v : c.label;
    });
    const dataStartIndex = headersAlreadyParsed ? 0 : 1;
    const dataRows = parsed.table.rows.slice(dataStartIndex).map(row => {
      const obj = {};
      row.c.forEach((cell, i) => { obj[headers[i]] = cell ? cell.v : null; });
      return obj;
    });
    return dataRows;
  } catch (e) {
    console.error('Fetch failed for gid', gid, e);
    return null;
  }
}

function fmtDate(d) {
  const date = new Date(d);
  return date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function toSentenceCase(s) {
  if (!s) return s;
  const str = String(s);
  return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
}

function renderToday(rows) {
  const stamp = document.getElementById('status-stamp');
  const section = document.getElementById('today-section');
  const dateEl = document.getElementById('today-date');
  dateEl.textContent = fmtDate(new Date());

  if (!rows || rows.length === 0) {
    stamp.textContent = 'PENDING';
    stamp.classList.add('pending');
    section.innerHTML = '<div class="empty-state">Nothing logged yet today. Record a voice note to get started.</div>';
    return;
  }

  const today = rows[rows.length - 1];
  stamp.textContent = 'LOGGED';
  stamp.classList.remove('pending');

  const statusClass = (v) => v === 'yes' || v === 'good' ? 'good' : (v === 'no' || v === 'bad' || v === 'poor' ? 'flag' : '');
  // Strip the trailing " - recurring:true/false" marker before display; it's an internal flag for the judgment layer, not meant for the dashboard.
  const cleanSoreness = today.soreness_mentions ? String(today.soreness_mentions).replace(/\s*-\s*recurring:(true|false)\s*$/i, '').trim() : '';

  section.innerHTML = `
    <div class="field-row"><span class="field-label">Workout</span><span class="field-value ${statusClass(today.workout_status)}">${toSentenceCase(today.workout_status) || '—'}</span></div>
    <div class="field-row"><span class="field-label">Water intake</span><span class="field-value ${statusClass(today.water_intake)}">${toSentenceCase(today.water_intake) || '—'}</span></div>
    <div class="field-row"><span class="field-label">Eating</span><span class="field-value ${statusClass(today.eating_quality)}">${toSentenceCase(today.eating_quality) || '—'}</span></div>
    ${cleanSoreness ? `<div class="field-row"><span class="field-label">Noted</span><span class="field-value flag">${toSentenceCase(cleanSoreness)}</span></div>` : ''}
    ${today.raw_transcript ? `<div class="transcript-quote">"${today.raw_transcript}"</div>` : ''}
  `;
}

function renderWeek(rows) {
  const section = document.getElementById('week-section');
  if (!rows || rows.length === 0) {
    section.innerHTML = '<div class="empty-state">No weekly check-in logged yet. Weight, runs/bikes, and dumbbell weight will appear here.</div>';
    return;
  }
  const wk = rows[rows.length - 1];
  section.innerHTML = `
    <div class="week-row">
      <div class="week-stat"><div class="num">${wk.starting_weight || '—'}</div><div class="label">Weight (lbs)</div></div>
      <div class="week-stat"><div class="num">${wk.dumbbell_weight || '—'}</div><div class="label">Dumbbells (lbs)</div></div>
      <div class="week-stat"><div class="num">${wk.ran === 'true' || wk.ran === true ? 'Yes' : 'No'}</div><div class="label">Ran this week</div></div>
      <div class="week-stat"><div class="num">${wk.biked === 'true' || wk.biked === true ? 'Yes' : 'No'}</div><div class="label">Biked this week</div></div>
    </div>
  `;
}

function renderMorningCheck(rows) {
  const section = document.getElementById('morningcheck-section');
  if (!rows || rows.length === 0) {
    section.innerHTML = '<div class="empty-state">No morning check yet today. One runs automatically at 6:30am.</div>';
    return;
  }
  const latest = rows[rows.length - 1];
  section.innerHTML = `
    <div class="directive">
      <span class="rec">${(latest.recommendation || '').toUpperCase()}</span>
    </div>
  `;
}

function renderWeather(rows) {
  const section = document.getElementById('weather-section');
  if (!rows || rows.length === 0) {
    section.innerHTML = '<div class="empty-state">No forecast pulled yet.</div>';
    return;
  }
  const w = rows[rows.length - 1];
  const rec = (w.cardio_recommendation || '—').replace(/['"]/g, '').trim().toUpperCase();
  const tempDisplay = (w.temp_high !== null && w.temp_high !== undefined && w.temp_high !== '')
    ? Number(w.temp_high).toFixed(1)
    : null;
  section.innerHTML = `
    <div class="directive">
      <span class="rec">${rec}</span>
      <span class="why">${w.forecast_tomorrow || ''}${tempDisplay !== null ? ` · ${tempDisplay}°` : ''}</span>
    </div>
  `;
}

function fmtWeekEndingSaturday(d) {
  // Weeks run Sunday-to-Saturday; given any date that falls within the week, return that week's Saturday.
  const date = new Date(d);
  const day = date.getDay(); // 0 = Sunday ... 6 = Saturday
  const daysUntilSaturday = 6 - day;
  const saturday = new Date(date);
  saturday.setDate(date.getDate() + daysUntilSaturday);
  return saturday.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function renderWeeklySummary(rows) {
  const section = document.getElementById('weeklysummary-section');
  if (!rows || rows.length === 0) {
    section.innerHTML = '<div class="empty-state">No weekly summary yet. One will be generated Saturday evening, reviewing the full week.</div>';
    return;
  }
  const latest = rows[rows.length - 1];
  section.innerHTML = `
    <div class="ledger-line">
      <p style="font-size:14px; line-height:1.6; margin:0;">${latest.summary_text || ''}</p>
      <p style="font-size:11px; color:var(--iron); margin-top:12px;">Week ending ${latest.week_ending ? fmtWeekEndingSaturday(latest.week_ending) : ''}</p>
    </div>
  `;
}

function renderFindings(rows) {
  const section = document.getElementById('findings-section');
  if (!rows || rows.length === 0) {
    section.innerHTML = '<div class="empty-state">No findings yet. The agent reviews recent history and will flag anything worth attention here.</div>';
    return;
  }
  const reversed = [...rows].reverse();
  section.innerHTML = '<div class="findings-list">' + reversed.map(f => `
    <div class="finding ${f.finding_type === 'flag' ? 'flag-type' : ''}">
      <div class="f-title">${f.title || ''}</div>
      <div class="f-detail">${f.detail || ''}</div>
      ${f.date ? `<div class="f-date">${fmtDate(f.date)}</div>` : ''}
    </div>
  `).join('') + '</div>';
}

async function loadDashboard() {
  const [daily, weekly, weather, findings, weeklySummaries, morningChecks] = await Promise.all([
    fetchTab(GIDS.daily_log),
    fetchTab(GIDS.weekly_log),
    fetchTab(GIDS.weather_log),
    fetchTab(GIDS.agent_findings),
    fetchTab(GIDS.weekly_summaries),
    fetchTab(GIDS.morning_checks)
  ]);
  renderToday(daily);
  renderWeek(weekly);
  renderMorningCheck(morningChecks);
  renderWeather(weather);
  renderWeeklySummary(weeklySummaries);
  renderFindings(findings);
  document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

loadDashboard();


// ── Q&A ──────────────────────────────────────────────────────
const QA_SUGGESTIONS = [
  'How has my knee been lately?',
  'Am I on a dumbbell plateau?',
  'How consistent have my workouts been?',
  'Summarize my last 5 training sessions',
  'Any patterns in my water intake?',
];

const QA_SYSTEM = `You are a personal health and fitness coach answering questions about Michael's training log. You have been given the full contents of his training data below. Answer specifically and honestly, referencing actual dates, numbers, and patterns from the data. If the data doesn't contain enough to answer, say so directly. Keep answers concise and coach-like — no fluff, no generic advice.`;

let qaHistory = [];
let qaLoading = false;
let qaDataCache = null;

async function fetchQaData() {
  if (qaDataCache) return qaDataCache;
  const [daily, weekly, findings, summaries] = await Promise.all([
    fetchTab(GIDS.daily_log),
    fetchTab(GIDS.weekly_log),
    fetchTab(GIDS.agent_findings),
    fetchTab(GIDS.weekly_summaries),
  ]);
  qaDataCache = { daily, weekly, findings, summaries };
  return qaDataCache;
}

function buildDataContext(data) {
  const fmt = (rows, label) => {
    if (!rows || rows.length === 0) return `${label}: no data`;
    return `${label} (${rows.length} entries, most recent first):
` +
      [...rows].reverse().slice(0, 30).map(r => JSON.stringify(r)).join('\n');
  };
  return [
    fmt(data.daily, 'daily_log'),
    fmt(data.weekly, 'weekly_log'),
    fmt(data.findings, 'agent_findings'),
    fmt(data.summaries, 'weekly_summaries'),
  ].join('\n');
}

function qaAddBubble(text, role) {
  const msgs = document.getElementById('qa-messages');
  const div = document.createElement('div');
  div.className = 'qa-bubble ' + role;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function qaAddTyping() {
  const msgs = document.getElementById('qa-messages');
  const div = document.createElement('div');
  div.id = 'qa-typing';
  div.className = 'qa-typing';
  div.innerHTML = '<div class="qa-dot"></div><div class="qa-dot"></div><div class="qa-dot"></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function qaRemoveTyping() {
  const t = document.getElementById('qa-typing');
  if (t) t.remove();
}

function qaSetBtnState(active) {
  const btn = document.getElementById('qa-btn');
  btn.style.background = active ? 'var(--ink)' : 'var(--hairline)';
  btn.style.color = active ? 'var(--chalk)' : 'var(--iron)';
  btn.style.cursor = active ? 'pointer' : 'default';
}

async function qaAsk(question) {
  if (!question.trim() || qaLoading) return;
  qaLoading = true;
  const input = document.getElementById('qa-input');
  input.value = '';
  qaSetBtnState(false);

  // Hide suggestions after first question
  const sugg = document.getElementById('qa-suggestions');
  if (sugg) sugg.style.display = 'none';

  qaAddBubble(question, 'user');
  qaAddTyping();

  try {
    const data = await fetchQaData();
    const context = buildDataContext(data);
    const userMsg = { role: 'user', content: question };
    qaHistory = [...qaHistory, userMsg];

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: QA_SYSTEM + '\n\nTraining data:\n' + context,
        messages: qaHistory,
      })
    });

    const result = await res.json();
    qaRemoveTyping();

    if (result.error) {
      qaHistory = qaHistory.slice(0, -1);
      qaAddBubble(result.error.message || 'Something went wrong.', 'error');
      qaLoading = false;
      return;
    }

    const text = (result.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n') || 'No response.';
    qaHistory = [...qaHistory, { role: 'assistant', content: text }];
    qaAddBubble(text, 'assistant');

  } catch(e) {
    qaRemoveTyping();
    qaHistory = qaHistory.slice(0, -1);
    qaAddBubble('Network error — check your connection and try again.', 'error');
  }

  qaLoading = false;
}

function initQa() {
  const sugg = document.getElementById('qa-suggestions');
  const input = document.getElementById('qa-input');
  const btn = document.getElementById('qa-btn');

  if (!sugg || !input || !btn) {
    console.error('Q&A elements not found, retrying...');
    setTimeout(initQa, 100);
    return;
  }

  QA_SUGGESTIONS.forEach(function(s) {
    const b = document.createElement('button');
    b.className = 'qa-chip';
    b.textContent = s;
    b.onclick = function() { qaAsk(s); };
    sugg.appendChild(b);
  });

  function onInputChange() {
    qaSetBtnState(input.value.trim().length > 0 && !qaLoading);
  }

  input.addEventListener('input', onInputChange);
  input.addEventListener('keyup', onInputChange);

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      if (input.value.trim() && !qaLoading) qaAsk(input.value);
    }
  });

  btn.onclick = function() {
    if (input.value.trim() && !qaLoading) qaAsk(input.value);
  };
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initQa);
} else {
  initQa();
}

</script>
</body>
</html>
